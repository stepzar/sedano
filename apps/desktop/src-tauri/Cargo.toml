[package]
name = "sedano"
version = "0.1.0"
description = "A minimal cockpit for coding-agent harnesses"
authors = ["Stefano Zarro"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sedano_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# The native folder chooser for a workspace: macOS already has the best picker.
tauri-plugin-dialog = "2"
# Links in a reply open in the default browser; the webview itself never leaves the app.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "~2.12"
tauri-plugin-process = "~2.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
