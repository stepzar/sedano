name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not open an issue: use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Claude Code session on ...
        2. Send ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - Grok
        - opencode
        - Command Code
        - Freebuff
        - Terminal tab
        - Not harness-specific
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does the session run
      options:
        - This Mac
        - SSH host
        - Remote mode (phone or another device)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Sedano version or commit, macOS version, and the harness CLI version.
      placeholder: "Sedano 0.1.0 (abc1234), macOS 15.5, claude 2.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, emails and private paths before pasting.
      render: text
